name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]     # Кай для Windows и для Mac — одни и те же тесты
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Character self-check
        run: node character/test.mjs
      - name: Tests
        shell: pwsh
        run: |
          python -m pytest -q -rf --tb=short -o faulthandler_timeout=60 2>&1 | Tee-Object -FilePath pytest.log
          exit $LASTEXITCODE
      - name: Show failures as annotations
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path pytest.log -Pattern '^(FAILED|ERROR)|Error|assert|Timeout|fatal' |
            Select-Object -First 25 | ForEach-Object { "::error::$($_.Line)" }
          Get-Content pytest.log -Tail 5 | ForEach-Object { "::warning::$_" }
