name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Character self-check
        run: node character/test.mjs
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rf --tb=short -o faulthandler_timeout=60 2>&1 | tee pytest.log
      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)|Error|assert|Timeout|fatal" pytest.log | head -25 | sed 's/^/::error::/'
          tail -5 pytest.log | sed 's/^/::warning::/'
