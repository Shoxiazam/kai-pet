name: release

# Новая версия: git tag v1.2.0 && git push origin v1.2.0 — здесь соберутся установщик и портативная версия
# и появятся в Releases. Сайт берёт последнюю версию по постоянной ссылке releases/latest/download/KaiPet-Setup.exe.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      # Тесты гоняет tests.yml на каждый push, в том числе на этот тег; здесь — только сборка.
      - name: Smoke check (exporter imports, frames are there)
        run: python -c "import kai_pet.export, kai_pet.pet as p; assert (p.ASSETS / 'frames' / p.NEWEST_ANIM).is_dir()"
      - name: Version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content kai_pet/__init__.py -Raw) -replace '__version__ = "[^"]*"', "__version__ = `"$version`"" |
            Set-Content kai_pet/__init__.py -NoNewline -Encoding utf8
      - name: Build Kai (folder, fast start)
        run: python build_exe.py
      - name: Installer KaiPet-Setup.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$version" installer\KaiPet.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\KaiPet\* -DestinationPath dist\KaiPet-portable.zip
      - name: Stickers zip
        shell: pwsh
        run: Compress-Archive -Path stickers\pack\* -DestinationPath dist\KaiPet-stickers.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KaiPet-Setup.exe
            dist/KaiPet-portable.zip
            dist/KaiPet-stickers.zip
          generate_release_notes: true
          body: |
            **Скачать:** [KaiPet-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/KaiPet-Setup.exe) — установка за пару кликов, без прав администратора.
            Без установки — KaiPet-portable.zip: распакуйте и запустите KaiPet.exe.
            **Mac (Apple M1 и новее):** KaiPet-macOS.dmg — откройте и перетащите Кая в «Программы».
            Сайт: https://shoxiazam.github.io/kai-pet/

  macos:
    # Выпуск создаёт сборка Windows; Mac добавляет к нему свой .dmg.
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' -E "s/__version__ = \"[^\"]*\"/__version__ = \"$VERSION\"/" kai_pet/__init__.py
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build KaiPet.app
        run: python build_exe.py
      - name: Menu-bar app, version, camera note, ad-hoc signature
        run: |
          PLIST=dist/KaiPet.app/Contents/Info.plist
          plutil -replace LSUIElement -bool true "$PLIST"                     # без значка в Dock — Кай живёт у часов
          plutil -replace CFBundleDisplayName -string "Кай" "$PLIST"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          plutil -replace NSCameraUsageDescription -string "Кай-сторож фотографирует, кто трогает Mac, пока вас нет." "$PLIST"
          plutil -replace NSAppleEventsUsageDescription -string "Кай танцует под то, что играет в Spotify и «Музыке»." "$PLIST"
          codesign --force --deep --sign - dist/KaiPet.app                      # после правки Info.plist подпись заново
          codesign --verify --deep --strict dist/KaiPet.app
      - name: Smoke test (Kai starts and draws a new look by himself)
        run: |
          KAI_LOOK='{"kind":"fox","color":"ginger","acc":["bow"]}' KAI_OUT="$RUNNER_TEMP/look" \
            dist/KaiPet.app/Contents/MacOS/KaiPet --export
          test -d "$RUNNER_TEMP/look/frames/holdR"
          QT_QPA_PLATFORM=offscreen KAI_PET_STATE="$RUNNER_TEMP/state.json" dist/KaiPet.app/Contents/MacOS/KaiPet &
          PID=$!
          sleep 12
          kill -0 "$PID"                                                        # не упал за 12 секунд
          kill "$PID"
      - name: KaiPet-macOS.dmg
        run: |
          mkdir dmg
          cp -R dist/KaiPet.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Кай" -srcfolder dmg -ov -format UDZO dist/KaiPet-macOS.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/KaiPet-macOS.dmg
